<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141920"/>
    </marker>
    <marker id="arcfg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A2611A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="430" fill="#FFFFFF"/>

  <!-- card boundary -->
  <rect x="212" y="145" width="758" height="252" rx="5" fill="none" stroke="#3E6E9E" stroke-width="1" stroke-dasharray="6 5" opacity=".65"/>
  <text x="591" y="386" text-anchor="middle" fill="#3E6E9E" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="1.1">ALVEO U55C · COYOTE SHELL</text>

  <!-- control path -->
  <rect x="420" y="60" width="340" height="56" rx="4" fill="#F5E8D6" stroke="#A2611A" stroke-width="1.2"/>
  <text x="590" y="83" text-anchor="middle" fill="#141920" font-size="15" font-weight="600">Config / CSR</text>
  <text x="590" y="101" text-anchor="middle" fill="#5B6675" font-family="Menlo, Consolas, monospace" font-size="11.5">mode · stride · μ,σ writeback</text>

  <g stroke="#A2611A" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arcfg)">
    <path d="M115,190 V88 H412"/>
    <path d="M495,118 V183"/>
    <path d="M685,118 V183"/>
  </g>

  <!-- boxes -->
  <g font-size="15" font-weight="600" fill="#141920">
    <rect x="40" y="190" width="150" height="88" rx="4" fill="#ECEFF3" stroke="#78838F" stroke-width="1.4"/>
    <text x="115" y="219" text-anchor="middle">DuckDB</text>
    <rect x="230" y="190" width="150" height="88" rx="4" fill="#E3ECF6" stroke="#3E6E9E" stroke-width="1.4"/>
    <text x="305" y="219" text-anchor="middle">PCIe DMA</text>
    <rect x="420" y="190" width="150" height="88" rx="4" fill="#E3ECF6" stroke="#3E6E9E" stroke-width="1.4"/>
    <text x="495" y="216" text-anchor="middle">Column-chunk</text>
    <text x="495" y="234" text-anchor="middle">decoder</text>
    <rect x="610" y="190" width="150" height="88" rx="4" fill="#E3ECF6" stroke="#3E6E9E" stroke-width="1.4"/>
    <text x="685" y="216" text-anchor="middle">Statistical</text>
    <text x="685" y="234" text-anchor="middle">operator</text>
    <rect x="800" y="190" width="150" height="88" rx="4" fill="#E3ECF6" stroke="#3E6E9E" stroke-width="1.4"/>
    <text x="875" y="219" text-anchor="middle">Output writer</text>
    <rect x="990" y="190" width="150" height="88" rx="4" fill="#ECEFF3" stroke="#78838F" stroke-width="1.4"/>
    <text x="1065" y="219" text-anchor="middle">Host</text>
  </g>

  <g font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5B6675" text-anchor="middle">
    <text x="115" y="240">zscore() scan</text>
    <text x="115" y="257">windowed submit</text>
    <text x="305" y="240">host → card</text>
    <text x="305" y="257">AXI4-Stream</text>
    <text x="495" y="255">RLE / bit-pack · N lanes</text>
    <text x="685" y="253">P1: Σx, Σx², n</text>
    <text x="685" y="269">P2: classify</text>
    <text x="875" y="240">1 int32 flag</text>
    <text x="875" y="257">per value</text>
    <text x="1065" y="240">two-phase finalize</text>
    <text x="1065" y="257">outlier ids only</text>
  </g>

  <!-- data edges -->
  <g stroke="#141920" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M190,234 H224"/>
    <path d="M380,234 H414"/>
    <path d="M570,234 H604"/>
    <path d="M760,234 H794"/>
    <path d="M950,234 H984"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="11" fill="#5B6675" text-anchor="middle">
    <text x="397" y="224">pages</text>
    <text x="587" y="224">int32</text>
    <text x="777" y="224">4 B/row</text>
  </g>

  <!-- pass-2 feedback -->
  <path d="M685,278 V345 H305 V284" fill="none" stroke="#141920" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#ar)" opacity=".8"/>
  <text x="495" y="337" text-anchor="middle" fill="#5B6675" font-family="Menlo, Consolas, monospace" font-size="11">pass 2 · re-send column</text>
</svg>
