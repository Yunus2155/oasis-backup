<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 440" width="1180" height="440"
     font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#111">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#111"/>
    </marker>
    <pattern id="fifo" width="7" height="6" patternUnits="userSpaceOnUse">
      <rect width="7" height="6" fill="#E8843C"/>
      <rect x="5" width="2" height="6" fill="#fff"/>
    </pattern>
  </defs>

  <rect width="1180" height="440" fill="#fff"/>

  <!-- ================= compute node ================= -->
  <rect x="6" y="8" width="846" height="424" rx="6" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- database system -->
  <rect x="20" y="22" width="172" height="396" rx="3" fill="#E6E6E6" stroke="#333"/>
  <text transform="rotate(-90 36 220)" x="36" y="220" text-anchor="middle">Database system</text>

  <rect x="54" y="34" width="130" height="372" fill="#fff" stroke="#333"/>
  <text transform="rotate(-90 70 220)" x="70" y="220" text-anchor="middle">Main memory</text>

  <rect x="92" y="46" width="84" height="30" fill="url(#fifo)" stroke="#333"/>
  <rect x="92" y="88" width="84" height="52" fill="#fff" stroke="#333"/>
  <rect x="92" y="150" width="84" height="52" fill="#fff" stroke="#333"/>
  <rect x="92" y="212" width="84" height="52" fill="#fff" stroke="#333"/>
  <rect x="92" y="274" width="84" height="120" fill="#fff" stroke="#333"/>
  <text transform="rotate(-90 134 334)" x="134" y="334" text-anchor="middle">Output buffer</text>

  <!-- PCIe block arrow -->
  <path d="M198,220 L236,168 L236,196 L258,196 L258,244 L236,244 L236,272 Z" fill="#A6A6A6" stroke="#666"/>
  <text transform="rotate(-90 247 220)" x="247" y="220" text-anchor="middle">PCIe</text>

  <!-- ================= Oasis SmartNIC ================= -->
  <rect x="266" y="22" width="572" height="396" rx="3" fill="#E6E6E6" stroke="#333"/>
  <text x="552" y="39" text-anchor="middle" font-size="10.5">Oasis SmartNIC</text>

  <rect x="310" y="48" width="470" height="26" rx="13" fill="#E8843C" stroke="#B4601F"/>
  <text x="545" y="65" text-anchor="middle">Memory-mapped configuration</text>

  <rect x="430" y="84" width="160" height="24" rx="12" fill="#E8843C" stroke="#B4601F"/>
  <text x="510" y="100" text-anchor="middle">Profiler</text>

  <!-- config fan-out -->
  <g stroke="#111" stroke-width="1.1" fill="none" stroke-dasharray="2 2.5" marker-end="url(#a)">
    <path d="M510,74 V82"/>
    <path d="M330,74 V114"/>
    <path d="M400,74 V116"/>
    <path d="M620,74 V116"/>
    <path d="M745,74 V114"/>
  </g>
  <!-- host <-> configuration -->
  <path d="M182,61 H304" stroke="#111" stroke-width="1.1" fill="none" stroke-dasharray="2 2.5"
        marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- datapath, right to left: fetcher, decoder, statistics, output writer -->
  <rect x="278" y="118" width="32" height="250" fill="#fff" stroke="#333"/>
  <text transform="rotate(-90 294 243)" x="294" y="243" text-anchor="middle">DMA controller</text>

  <rect x="314" y="118" width="32" height="250" fill="#E8843C" stroke="#B4601F"/>
  <text transform="rotate(-90 330 243)" x="330" y="243" text-anchor="middle">Output writer</text>

  <g fill="#5BAE7C" stroke="#2F7F52">
    <rect x="352" y="120" width="150" height="44" rx="3"/>
    <rect x="352" y="172" width="150" height="44" rx="3"/>
    <rect x="352" y="224" width="150" height="44" rx="3"/>
    <rect x="352" y="276" width="150" height="44" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="427" y="146">Statistics operator</text>
    <text x="427" y="198">Statistics operator</text>
    <text x="427" y="250">Statistics operator</text>
    <text x="427" y="302">Statistics operator</text>
  </g>

  <g fill="#4E8FD1" stroke="#2B6CA8">
    <rect x="508" y="120" width="215" height="44" rx="3"/>
    <rect x="508" y="172" width="215" height="44" rx="3"/>
    <rect x="508" y="224" width="215" height="44" rx="3"/>
    <rect x="508" y="276" width="215" height="44" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="616" y="146">Column-chunk decoder</text>
    <text x="616" y="198">Column-chunk decoder</text>
    <text x="616" y="250">Column-chunk decoder</text>
    <text x="616" y="302">Column-chunk decoder</text>
  </g>

  <rect x="729" y="118" width="32" height="250" fill="#E8843C" stroke="#B4601F"/>
  <text transform="rotate(-90 745 243)" x="745" y="243" text-anchor="middle">Data fetcher</text>

  <rect x="765" y="118" width="32" height="250" fill="#fff" stroke="#333"/>
  <text transform="rotate(-90 781 243)" x="781" y="243" text-anchor="middle">Network stack</text>

  <rect x="801" y="118" width="28" height="250" fill="#BEBEBE" stroke="#333"/>
  <text transform="rotate(-90 815 243)" x="815" y="243" text-anchor="middle">QSFP</text>

  <rect x="352" y="330" width="371" height="20" fill="#58585A"/>
  <text x="537" y="344" text-anchor="middle" fill="#fff">Bypass stream</text>

  <rect x="330" y="372" width="200" height="32" rx="4" fill="#fff" stroke="#333"/>
  <text x="430" y="392" text-anchor="middle">TLB</text>
  <rect x="550" y="372" width="200" height="32" rx="4" fill="#fff" stroke="#333"/>
  <text x="650" y="392" text-anchor="middle">Virtualization</text>

  <!-- ================= network + storage ================= -->
  <path d="M829,220 H886" stroke="#333" stroke-width="1.2" fill="none" stroke-dasharray="5 4"/>
  <ellipse cx="948" cy="220" rx="62" ry="44" fill="#fff" stroke="#333"/>
  <text x="948" y="216" text-anchor="middle">Data center</text>
  <text x="948" y="230" text-anchor="middle">network</text>
  <path d="M1010,220 H1030" stroke="#333" stroke-width="1.2" fill="none" stroke-dasharray="5 4"/>

  <rect x="1030" y="60" width="130" height="320" rx="3" fill="#E6E6E6" stroke="#333"/>
  <text transform="rotate(-90 1046 220)" x="1046" y="220" text-anchor="middle">Cloud object storage</text>
  <rect x="1064" y="76" width="84" height="288" fill="#fff" stroke="#333"/>
  <text transform="rotate(-90 1106 220)" x="1106" y="220" text-anchor="middle">Parquet file</text>
</svg>
